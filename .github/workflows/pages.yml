name: Deploy DaBrik to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build frontend artifact
        env:
          DABRIK_API_BASE_URL: ${{ vars.DABRIK_API_BASE_URL }}
        run: |
          mkdir -p _site
          cp -R frontend/. _site/
          node <<'NODE'
          const fs = require('node:fs');
          const raw = (process.env.DABRIK_API_BASE_URL || '').trim();
          let apiBaseUrl = '';
          if (raw) {
            const api = new URL(raw);
            if (api.protocol !== 'https:' || api.username || api.password || api.pathname !== '/' || api.search || api.hash) {
              throw new Error('DABRIK_API_BASE_URL deve ser uma origem HTTPS, sem caminho, query ou fragmento.');
            }
            apiBaseUrl = api.origin;
          }
          fs.writeFileSync('_site/config.js', `window.DABRIK_CONFIG=${JSON.stringify({ basePath: '/Dabrik/', apiBaseUrl })};\n`);
          fs.copyFileSync('_site/index.html', '_site/404.html');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
